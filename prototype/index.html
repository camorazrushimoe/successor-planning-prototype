<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Successor 0.5</title>
<style>
:root{--bg:#10141a;--card:#181e26;--line:#2c3540;--txt:#e8eef4;--dim:#8b97a6;--acc:#3dba7a;--chip:#232b34}
body.head{--acc:#3dba7a;--bg:#0e1612}body.hr{--acc:#9b7aed;--bg:#141018}body.observer{--acc:#8b97a6;--bg:#121417}body.candidate{--acc:#e0b44b;--bg:#18140c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 ui-sans-serif,system-ui}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
button{background:var(--chip);border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:8px;cursor:pointer}
.on,button.acc{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,#1a1f26)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.risk{border-color:#5a2a2a}.chip{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--chip)}
.why{color:var(--dim);font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9}
.box{background:var(--card);padding:16px;border-radius:12px;width:min(440px,94%)}
input,select,textarea{width:100%;background:#0f141a;border:1px solid var(--line);color:var(--txt);padding:8px;border-radius:8px;margin:4px 0}
.how{margin:12px 16px;padding:10px;border:1px solid var(--line);border-radius:10px;max-width:820px}
.nine{display:grid;grid-template-columns:70px repeat(3,1fr);gap:6px;padding:0 16px;max-width:860px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:80px;padding:6px}
</style></head><body class="head">
<header><b>Successor 0.5</b><span id="nav"></span><span id="sw"></span><span id="cnt" class="why" style="margin-left:auto"></span></header>
<main id="app"></main>
<script src="app.js"></script>
</body></html>
